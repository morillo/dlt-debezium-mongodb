# Pipeline resource for the MongoDB Debezium CDC pipeline.
# One deployed pipeline ingests one collection; the collection is
# chosen entirely through bundle variables.

resources:
  pipelines:
    dlt_debezium_mongodb:
      name: dlt-debezium-mongodb-${var.collection}-${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.target_schema}
      serverless: true
      continuous: false # run triggered; schedule with a job or enable
      channel: CURRENT
      root_path: ../src
      libraries:
        - glob:
            include: ../src/dlt_pipeline_debezium_mongodb.py
      configuration:
        pipeline.landing_root: ${var.landing_root}
        pipeline.database: ${var.database}
        pipeline.collection: ${var.collection}
        pipeline.projection: ${var.projection}
